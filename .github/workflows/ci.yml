name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # A hung test blocks the job for six hours on the default. The suite runs in about a minute.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run typecheck
      # Verbose so a hang names the last test that completed. Vitest reports per file by default,
      # which told us nothing when cli.test.ts hung: the file never reported at all.
      - run: bun run test --reporter=verbose
      # The SPA is a deliverable, so a build that stopped compiling should fail here rather than at
      # release time. typecheck and test already cover apps/web; this covers the bundle.
      - run: bun run build:web

      # Same reasoning for the landing page: pages.yml deploys whatever builds, so a template error
      # should fail a pull request rather than the deployment that follows it.
      - run: bun run build:site

      - name: Validate this repo's own backlog
        run: bun run doctor

      # The completion scripts are only exercised by the shell they are for, and neither of these can be
      # run on a developer machine by default. This is the whole verification story for both templates.
      - name: Completion works in a real fish
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fish

          project="$(mktemp -d)"
          bun run packages/cli/src/index.ts completion fish > "$project/motte.fish"

          # A `motte` on PATH, because the script calls the command by name.
          mkdir -p "$project/bin"
          printf '#!/bin/sh\nexec bun run %s/packages/cli/src/index.ts "$@"\n' "$PWD" > "$project/bin/motte"
          chmod +x "$project/bin/motte"
          export PATH="$project/bin:$PATH"

          cd "$project"
          MOTTE_AUTHOR=CI motte init --name Completion --no-agents > /dev/null
          MOTTE_AUTHOR=CI motte add "Parser rewrite" -l core > /dev/null

          # The headline feature: an issue completed from a fragment of its title.
          refs="$(fish -c "source $project/motte.fish; complete -C 'motte show pars'")"
          case "$refs" in
            *parser-rewrite*) echo "refs: $refs" ;;
            *) echo "fish did not complete an issue by title: $refs" >&2; exit 1 ;;
          esac

          # And a command name, which comes from yargs rather than from motte — it must not arrive as
          # `renumber:Give a fresh id…`, which is what fish showed before the format was per-request.
          cmds="$(fish -c "source $project/motte.fish; complete -C 'motte ren'")"
          case "$cmds" in
            *renumber:*) echo "fish got a colon-joined command name: $cmds" >&2; exit 1 ;;
            *renumber*) echo "commands: $cmds" ;;
            *) echo "fish did not complete a command name: $cmds" >&2; exit 1 ;;
          esac

      - name: Completion registers in a real PowerShell
        shell: pwsh
        run: |
          $project = Join-Path ([System.IO.Path]::GetTempPath()) 'motte-pwsh-completion'
          New-Item -ItemType Directory -Path $project -Force | Out-Null

          $script = Join-Path $project 'motte.ps1'
          bun run packages/cli/src/index.ts completion powershell | Set-Content -Path $script

          # Parses at all — a template with a syntax error would otherwise only fail on a user's machine.
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($script, [ref] $null, [ref] $errors) | Out-Null
          if ($errors.Count -gt 0) { throw "the completion script does not parse: $($errors[0].Message)" }

          # Registering is the other half: a bad Register-ArgumentCompleter call throws here.
          . $script
          Write-Host 'registered the argument completer'

          # A `motte` command for the completer to call, then ask PowerShell itself to complete a line.
          # An executable with no extension rather than a .ps1: this runs on Linux, where PATHEXT does
          # not apply and the completer resolves a native command.
          $bin = Join-Path $project 'bin'
          New-Item -ItemType Directory -Path $bin -Force | Out-Null
          $wrapper = Join-Path $bin 'motte'
          Set-Content -Path $wrapper -Value "#!/bin/sh`nexec bun run $PWD/packages/cli/src/index.ts `"`$@`""
          & chmod +x $wrapper
          $env:PATH = "$bin$([System.IO.Path]::PathSeparator)$env:PATH"

          Push-Location $project
          try {
              $env:MOTTE_AUTHOR = 'CI'
              motte init --name Completion --no-agents | Out-Null
              motte add 'Parser rewrite' | Out-Null

              $line = 'motte show pars'
              $completions = [System.Management.Automation.CommandCompletion]::CompleteInput(
                  $line, $line.Length, $null)

              $texts = $completions.CompletionMatches | ForEach-Object { $_.CompletionText }
              Write-Host "completions: $($texts -join ', ')"
              if ($texts -notcontains 'parser-rewrite') {
                  throw 'PowerShell did not complete an issue by title fragment'
              }
          }
          finally { Pop-Location }

  # The Windows installer, and the only place the Windows binary is ever executed. Nothing here can be
  # checked on a developer machine: there is no PowerShell on macOS or Linux by default, so this job is
  # the whole verification story for install.ps1.
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Unit-test the installer's helpers
        shell: pwsh
        run: pwsh -NoProfile -File scripts/install.ps1.tests.ps1

      # A pinned version rather than the live API lookup, so the job cannot flake on an
      # unauthenticated rate limit. The lookup's parsing is covered by the helper tests above.
      - name: Install a published release end to end
        shell: pwsh
        env:
          MOTTE_VERSION: v0.2.0
          MOTTE_INSTALL_DIR: ${{ runner.temp }}\motte
        run: |
          ./install.ps1

          $root = "${{ runner.temp }}\motte"
          $exe = Join-Path $root 'versions\v0.2.0\bin\motte.exe'
          if (-not (Test-Path $exe)) { throw "binary was not installed at $exe" }

          # The junction is what makes `current` follow the active version without admin rights.
          $current = Get-Item (Join-Path $root 'current') -Force
          if ($current.LinkType -ne 'Junction') { throw "current is $($current.LinkType), not a Junction" }
          if (-not (Test-Path (Join-Path $root 'current\bin\motte.exe'))) {
              throw 'the junction does not reach the binary'
          }

          # The PATH entry points through `current`, so it survives an upgrade.
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($userPath -notlike "*$root\current\bin*") { throw "PATH was not updated: $userPath" }

      - name: Run the installed binary
        shell: pwsh
        run: |
          $exe = "${{ runner.temp }}\motte\current\bin\motte.exe"

          $version = & $exe --version
          if ($version -notmatch '^\d+\.\d+\.\d+') { throw "unexpected --version output: $version" }

          # A real command, not just --version: this is the first time this binary has run at all, so
          # prove it can read and write a project rather than merely start.
          $project = Join-Path '${{ runner.temp }}' 'sample'
          New-Item -ItemType Directory -Path $project -Force | Out-Null
          Push-Location $project
          try {
              $env:MOTTE_AUTHOR = 'CI'
              & $exe init --name Sample
              & $exe add 'First issue' -d 'Created by CI on Windows'
              & $exe move 1 done
              $json = & $exe show 1 --json | ConvertFrom-Json
              if ($json.state -ne 'Done') { throw "expected Done, got $($json.state)" }
              & $exe doctor
              if ($LASTEXITCODE -ne 0) { throw 'doctor failed on a freshly created project' }
          }
          finally { Pop-Location }

      - name: Respect MOTTE_NO_MODIFY_PATH
        shell: pwsh
        env:
          MOTTE_VERSION: v0.2.0
          MOTTE_INSTALL_DIR: ${{ runner.temp }}\motte-quiet
          MOTTE_NO_MODIFY_PATH: "1"
        run: |
          $before = [Environment]::GetEnvironmentVariable('Path', 'User')
          ./install.ps1
          $after = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($before -ne $after) { throw 'PATH was modified despite MOTTE_NO_MODIFY_PATH' }
