name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write

# Three stages on purpose: build once, verify the built assets on both platforms, publish only if both
# pass. Verifying after publishing would mean a broken binary is downloadable before we find out, and the
# checksums only mean something if the published bytes are the ones that were tested — so the assets are
# built once and passed along rather than rebuilt per job.
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - run: bun install --frozen-lockfile

      - id: resolve
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # A release that reports the wrong version is worse than a failed release.
      - name: Tag must match package.json version
        run: |
          tag="${{ steps.resolve.outputs.tag }}"
          pkg="v$(bun -e 'console.log(require("./package.json").version)')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package.json ($pkg)" >&2
            exit 1
          fi
          echo "$tag matches package.json"

      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run doctor

      # Bun cross-compiles every target from one runner, so no build matrix is needed.
      - run: bun run build:release

      - name: Smoke-test the linux binary that was just built
        run: |
          gunzip -c dist/release/motte-linux-x64.gz > /tmp/motte
          chmod +x /tmp/motte
          [ "$(/tmp/motte --version)" = "$(bun -e 'console.log(require("./package.json").version)')" ]
          cd "$(mktemp -d)" && /tmp/motte init --name smoke
          /tmp/motte add "It runs" --json > /dev/null
          /tmp/motte doctor

      - name: Verify install.sh against the built assets
        run: |
          python3 -m http.server 8123 --directory dist/release &
          sleep 2
          MOTTE_VERSION="${{ steps.resolve.outputs.tag }}" \
          MOTTE_DOWNLOAD_BASE="http://127.0.0.1:8123" \
          MOTTE_INSTALL_DIR="$RUNNER_TEMP/motte-root" \
          MOTTE_BIN_DIR="$RUNNER_TEMP/motte-bin" \
            sh install.sh
          "$RUNNER_TEMP/motte-bin/motte" --version

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/release
          retention-days: 1
          if-no-files-found: error

  # The Windows half of the same check. Until this existed, a release's Windows binary was published
  # without ever being run: the CI job that exercises install.ps1 pins an already-published version, so it
  # can never catch a newly broken one.
  verify-windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/release

      - name: Install the built Windows asset with install.ps1
        shell: pwsh
        env:
          MOTTE_VERSION: ${{ needs.build.outputs.tag }}
          MOTTE_INSTALL_DIR: ${{ runner.temp }}\motte
          MOTTE_NO_MODIFY_PATH: "1"
        run: |
          # Served locally so the installer fetches exactly the bytes this release will publish, rather
          # than whatever happens to be on GitHub already.
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8123', '--directory', 'dist/release' -PassThru
          try {
              Start-Sleep -Seconds 2
              $env:MOTTE_DOWNLOAD_BASE = 'http://127.0.0.1:8123'
              ./install.ps1
          }
          finally {
              Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Run the built binary
        shell: pwsh
        run: |
          $exe = Join-Path '${{ runner.temp }}' 'motte\current\bin\motte.exe'

          $expected = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $actual = (& $exe --version | Out-String).Trim()
          if ($actual -ne $expected) { throw "binary reports $actual, package.json says $expected" }

          $project = Join-Path '${{ runner.temp }}' 'smoke'
          New-Item -ItemType Directory -Path $project -Force | Out-Null
          Push-Location $project
          try {
              $env:MOTTE_AUTHOR = 'CI'
              & $exe init --name smoke
              & $exe add 'It runs' --json | Out-Null
              & $exe doctor
              if ($LASTEXITCODE -ne 0) { throw 'doctor failed against a freshly created project' }
          }
          finally { Pop-Location }

  publish:
    needs: [build, verify-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/release

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          files: |
            dist/release/*.gz
            dist/release/checksums.txt
          generate_release_notes: true
          # Everything below 1.0 is a pre-release: the web UI does not exist yet, so the CLI and the MCP
          # server are usable but the product is not finished.
          prerelease: ${{ !startsWith(needs.build.outputs.tag, 'v1.') }}
