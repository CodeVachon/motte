name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - run: bun install --frozen-lockfile

      # A release that reports the wrong version is worse than a failed release.
      - name: Tag must match package.json version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          pkg="v$(bun -e 'console.log(require("./package.json").version)')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package.json ($pkg)" >&2
            exit 1
          fi
          echo "$tag matches package.json"

      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run doctor

      # Bun cross-compiles every target from one runner, so no build matrix is needed.
      - run: bun run build:release

      - name: Smoke-test the linux binary that was just built
        run: |
          gunzip -c dist/release/motte-linux-x64.gz > /tmp/motte
          chmod +x /tmp/motte
          [ "$(/tmp/motte --version)" = "$(bun -e 'console.log(require("./package.json").version)')" ]
          cd "$(mktemp -d)" && /tmp/motte init --name smoke
          /tmp/motte add "It runs" --json > /dev/null
          /tmp/motte doctor

      - name: Verify install.sh against the built assets
        run: |
          python3 -m http.server 8123 --directory dist/release &
          sleep 2
          MOTTE_VERSION="${{ github.event.inputs.tag || github.ref_name }}" \
          MOTTE_DOWNLOAD_BASE="http://127.0.0.1:8123" \
          MOTTE_INSTALL_DIR="$RUNNER_TEMP/motte-root" \
          MOTTE_BIN_DIR="$RUNNER_TEMP/motte-bin" \
            sh install.sh
          "$RUNNER_TEMP/motte-bin/motte" --version

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/release/*.gz
            dist/release/checksums.txt
          generate_release_notes: true
          # Everything below 1.0 is a pre-release: `motte serve`, `motte mcp` and the web UI do not
          # exist yet, so the CLI is usable but the product is not finished.
          prerelease: ${{ !startsWith(github.event.inputs.tag || github.ref_name, 'v1.') }}
